<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Emploi du temps</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EDT">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="month-nav">
        <button id="prev-btn" class="btn-ghost btn-icon" type="button" aria-label="Précédent">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <h1 id="month-label">Emploi du temps</h1>
        <button id="next-btn" class="btn-ghost btn-icon" type="button" aria-label="Suivant">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
      <div class="topbar-actions">
        <button id="view-toggle" class="btn-ghost" type="button" aria-pressed="false">Semaine</button>
      </div>
    </div>

    <nav class="weekstrip" id="weekstrip" aria-label="Jours de la semaine"></nav>
  </header>

  <!-- Modal de synchronisation -->
  <div id="sync-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="sync-title" hidden>
    <div class="modal-content">
      <h2 id="sync-title">Synchroniser avec Edusign</h2>
      <div id="sync-session-badge" class="session-badge"></div>
      <p id="sync-hint" class="modal-hint">Connexion directe et instantanée à l'API Edusign (sans A2F).</p>

      <input type="email" id="sync-email" autocomplete="username" placeholder="Email de l'école">
      <input type="password" id="sync-password" autocomplete="current-password" placeholder="Mot de passe Edusign">

      <button id="sync-start-btn" class="btn-primary" type="button">Mettre à jour</button>
      <button id="sync-toggle-pwd" class="btn-ghost" type="button" style="font-size: 13px; margin-top: 4px;" hidden>Changer de mot de passe</button>
      <button id="sync-logout-btn" class="btn-ghost" type="button" style="font-size: 13px; color: #ef4444; margin-top: 4px;" hidden>Oublier la session (déconnexion)</button>

      <div id="sync-status" class="sync-status" role="status" aria-live="polite"></div>

      <button id="sync-close-btn" class="btn-ghost sync-close" type="button">Fermer</button>
    </div>
  </div>

  <!-- Hors de #content : render() vide #content a chaque rendu. -->
  <div id="install-bar" class="install-bar" hidden>
    <p id="install-text" class="install-text"></p>
    <button id="install-btn" class="install-action" type="button" hidden>Installer</button>
    <button id="install-dismiss" class="btn-ghost install-dismiss" type="button" aria-label="Masquer">×</button>
  </div>

  <main id="content" class="content" tabindex="-1">
    <p class="loading">Chargement…</p>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Navigation principale">
    <button class="tab-btn active" id="tab-btn-planning" type="button" data-tab="planning">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <span>Planning</span>
    </button>
    <button class="tab-btn" id="tab-btn-assiduite" type="button" data-tab="assiduite">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 20V10"></path>
        <path d="M12 20V4"></path>
        <path d="M6 20v-6"></path>
      </svg>
      <span>Assiduité</span>
    </button>
    <button class="tab-btn" id="tab-btn-parametres" type="button" data-tab="parametres">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <span>Paramètres</span>
      <span id="settings-dot" class="settings-dot" hidden></span>
    </button>
  </nav>

  <script src="/app.js"></script>
</body>
</html>
