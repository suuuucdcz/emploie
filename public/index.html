<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Emploi du temps</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="month-nav" style="display: flex; align-items: center; gap: 4px;">
        <button id="prev-btn" class="btn-ghost btn-icon" type="button" aria-label="Précédent">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <h1 id="month-label" style="min-width: 130px; text-align: center;">Emploi du temps</h1>
        <button id="next-btn" class="btn-ghost btn-icon" type="button" aria-label="Suivant">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
      <div class="topbar-actions">
        <button id="view-toggle" class="btn-ghost" type="button" aria-pressed="false">Semaine</button>
        <button id="refresh" class="btn-ghost" type="button" title="Rafraichir" aria-label="Rafraichir">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round"/>
            <path d="M21 3v6h-6" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <nav class="weekstrip" id="weekstrip" aria-label="Jours de la semaine"></nav>
  </header>

  <!-- Modal de synchronisation -->
  <div id="sync-modal" class="modal" hidden>
    <div class="modal-content">
      <h2 style="margin: 0; font-size: 18px;">Mettre à jour via Microsoft</h2>
      <p style="font-size: 14px; color: var(--muted); margin-bottom: 10px;">Le serveur en arrière-plan va se connecter silencieusement pour aspirer ton année.</p>
      
      <input type="email" id="sync-email" placeholder="Email de l'école" value="mathis.derory@ipsa.fr" />
      <input type="password" id="sync-password" placeholder="Mot de passe" />
      
      <button id="sync-start-btn" class="btn-primary">Lancer la récupération</button>
      
      <div id="sync-status" style="margin-top: 10px; font-size: 14px; text-align: center;"></div>
      <div id="sync-a2f" style="font-size: 40px; font-weight: bold; color: var(--accent); text-align: center; display: none; margin: 15px 0;"></div>
      
      <button id="sync-close-btn" class="btn-ghost" style="margin-top: 10px; width: 100%;">Fermer</button>
    </div>
  </div>

  <main id="content" class="content" tabindex="-1">
    <p class="loading">Chargement…</p>
  </main>

  <footer class="statusbar">
    <span id="status-text">—</span>
    <button id="today" class="btn-today" type="button">Aujourd'hui</button>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
