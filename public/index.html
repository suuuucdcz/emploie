<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Emploi du temps</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EDT">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="month-nav">
        <button id="prev-btn" class="btn-ghost btn-icon" type="button" aria-label="Précédent">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <h1 id="month-label">Emploi du temps</h1>
        <button id="next-btn" class="btn-ghost btn-icon" type="button" aria-label="Suivant">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
      <div class="topbar-actions">
        <button id="view-toggle" class="btn-ghost" type="button" aria-pressed="false">Semaine</button>
        <!-- Ce bouton ne recharge pas : il relance la synchronisation Auriga.
             D'ou le nuage, et non des fleches circulaires. -->
        <button id="refresh" class="btn-ghost" type="button"
                title="Synchroniser avec Auriga" aria-label="Synchroniser avec Auriga">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17.4 18.3a4.3 4.3 0 0 0 .4-8.56A6 6 0 0 0 6.2 8.9a4 4 0 0 0 .5 9.4"/>
            <path d="M12 11.5v7.5"/>
            <polyline points="9.2 16.2 12 19 14.8 16.2"/>
          </svg>
        </button>
      </div>
    </div>

    <nav class="weekstrip" id="weekstrip" aria-label="Jours de la semaine"></nav>
  </header>

  <!-- Modal de synchronisation -->
  <div id="sync-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="sync-title" hidden>
    <div class="modal-content">
      <h2 id="sync-title">Mettre à jour via Microsoft</h2>
      <p class="modal-hint">Le serveur en arrière-plan va se connecter pour aspirer ton année.</p>

      <input type="email" id="sync-email" autocomplete="username" placeholder="Email de l'école">
      <input type="password" id="sync-password" autocomplete="current-password" placeholder="Mot de passe">

      <button id="sync-start-btn" class="btn-primary" type="button">Lancer la récupération</button>

      <div id="sync-status" class="sync-status" role="status" aria-live="polite"></div>
      <div id="sync-a2f" class="sync-a2f" hidden></div>
      <img id="sync-screenshot" class="sync-screenshot" alt="Ce que voit le robot" hidden>

      <button id="sync-close-btn" class="btn-ghost sync-close" type="button">Fermer</button>
    </div>
  </div>

  <!-- Hors de #content : render() vide #content a chaque rendu. -->
  <div id="install-bar" class="install-bar" hidden>
    <p id="install-text" class="install-text"></p>
    <button id="install-btn" class="btn-primary" type="button" hidden>Installer l'application</button>
    <button id="install-dismiss" class="btn-ghost install-dismiss" type="button" aria-label="Masquer">×</button>
  </div>

  <main id="content" class="content" tabindex="-1">
    <p class="loading">Chargement…</p>
  </main>

  <footer class="statusbar">
    <span id="status-text">—</span>
    <button id="today" class="btn-today" type="button">Aujourd'hui</button>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
